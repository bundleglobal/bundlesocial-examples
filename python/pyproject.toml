[project]
name = "bundlesocial-python-example"
version = "0.1.0"
description = "Community-style raw-HTTP Python example for the bundle.social API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bundle.social" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
rich = ["rich>=13.0"]
dev = ["mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bundlesocial"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
